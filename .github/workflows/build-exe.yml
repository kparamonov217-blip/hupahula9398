name: Build Windows EXE + Installer

# Собирает WebExcel.exe и WebExcel-Setup.exe на облачном Windows-раннере
# и публикует их в GitHub Release. Скачивать можно по ссылке вида:
# https://github.com/<ВАШ-ЛОГИН>/<РЕПО>/releases/latest

on:
  push:
    tags:
      - 'v*'          # запускать при создании тега, например v1.0.0
  workflow_dispatch:  # плюс ручной запуск кнопкой на вкладке Actions

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NSIS (for Setup.exe)
        run: choco install nsis -y
        continue-on-error: true

      - name: Build portable EXE
        shell: cmd
        run: call electron\build.bat

      - name: Make installer + release folder
        shell: powershell
        run: |
          $env:Path += ";C:\Program Files (x86)\NSIS"
          powershell -ExecutionPolicy Bypass -File electron\make-setup.ps1

      - name: Check artifacts exist
        shell: pwsh
        run: |
          if (-not (Test-Path release)) { throw "release/ not found" }
          Get-ChildItem -Recurse release | Select-Object FullName, Length

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/WebExcel-Setup.exe
            release/WebExcel-portable.zip
          body: |
            WebExcel — настольный Excel-подобный редактор.
            • WebExcel-Setup.exe — установщик (ярлык на рабочем столе)
            • WebExcel-portable.zip — портативная версия (распакуй и запускай)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Also keep artifacts in Actions tab (no tag run)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: WebExcel-windows
          path: release/
